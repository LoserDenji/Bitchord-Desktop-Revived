name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages, without the leading v"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows · installer, portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Installer and portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          iscc /DAppVersion="$v" installer\bitchord.iss
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item installer\Output\bitchord-setup-$v.exe "dist\BitChord-$v-windows-x64-setup.exe"
          New-Item -ItemType Directory -Force portable\BitChord | Out-Null
          Copy-Item target\release\bitchord.exe portable\BitChord\
          Copy-Item installer\portable.txt portable\BitChord\
          Copy-Item README.md, LICENSE portable\BitChord\
          Compress-Archive -Path portable\BitChord -DestinationPath "dist\BitChord-$v-windows-x64-portable.zip" -Force
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  macos:
    name: macOS · app, dmg (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # macos-14 is retired (Nov 2026); macos-15 is arm64, supported into 2027.
          - os: macos-15
            arch: arm64
          # The last Intel runner label; x86_64 builds until Aug 2027.
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Build
        run: cargo build --release

      - name: App bundle
        run: |
          v="${{ steps.version.outputs.value }}"
          arch="${{ matrix.arch }}"
          mkdir -p dist bundle
          sh macos/bundle.sh target/release/bitchord "$v" bundle
          ditto -c -k --keepParent bundle/bitchord.app "dist/BitChord-$v-macos-$arch.zip"
          hdiutil create -volname "BitChord" -srcfolder bundle/bitchord.app -ov -format UDZO "dist/BitChord-$v-macos-$arch.dmg"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: dist/*

  linux:
    name: Linux · tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Native dependencies (GTK, WebKitGTK, ALSA, tray, DBus, TLS)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libssl-dev \
            pkg-config

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Tarball
        run: |
          v="${{ steps.version.outputs.value }}"
          mkdir -p "dist/BitChord-$v-linux-x86_64"
          cd "dist/BitChord-$v-linux-x86_64"
          cp ../../target/release/bitchord .
          cp ../../linux/install.sh .
          cp ../../linux/bitchord.desktop .
          cp ../../linux/portable.txt .
          cp ../../assets/icon/icon.png bitchord.png
          cp ../../README.md .
          cp ../../LICENSE .
          cd ..
          tar -czf "BitChord-$v-linux-x86_64.tar.gz" "BitChord-$v-linux-x86_64"
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*.tar.gz

  release:
    name: Publish
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist

      - run: ls -lh dist

      - name: Draft the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BitChord ${{ github.ref_name }}
          draft: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
