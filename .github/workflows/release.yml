name: Release

# Builds the downloads from the tagged source and attaches them all to the GitHub
# release: Windows (setup exe and portable zip), macOS (one universal dmg) and Linux
# (an install.sh tarball, a portable tarball and a .deb — no AppImage; the updater on
# Linux reads the tarballs, and a .deb-installed copy is only told that a new version
# is out, for apt to install over it).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages, without the leading v"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows · installer, portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Installer and portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          iscc /DAppVersion="$v" installer\bitchord.iss
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item installer\Output\bitchord-setup-$v.exe "dist\BitChord-$v-windows-x64-setup.exe"
          New-Item -ItemType Directory -Force portable\BitChord | Out-Null
          # The exe statically links the WebView2 loader, so there's no DLL to carry.
          Copy-Item target\release\bitchord.exe portable\BitChord\
          Copy-Item installer\portable.txt portable\BitChord\
          Copy-Item README.md, LICENSE portable\BitChord\
          Compress-Archive -Path portable\BitChord -DestinationPath "dist\BitChord-$v-windows-x64-portable.zip" -Force
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS · universal dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos

      # The runner image ships several Xcode copies (~12 GB each) plus simulators and
      # toolchains nothing here uses. A universal build compiles the app twice, and
      # hdiutil's dmg staging needs a few GB on top — without this, the dmg step dies
      # with "No space left on device".
      - name: Free disk space
        run: |
          echo "Free at start: $(df -h / | awk 'NR==2 {print $4}')"
          # Keep only the Xcode xcode-select points at; the others are dead weight.
          selected="$(xcode-select -p | cut -d/ -f1-3)"
          for app in /Applications/Xcode*.app; do
            [ "$app" = "$selected" ] || sudo rm -rf "$app"
          done
          sudo rm -rf /Library/Developer/CoreSimulator \
            ~/Library/Developer/CoreSimulator ~/Library/Developer/Xcode \
            ~/Library/Android/sdk /usr/local/lib/android /usr/local/.ghcup \
            ~/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          brew cleanup --prune=all >/dev/null 2>&1 || true
          echo "Free after cleanup: $(df -h / | awk 'NR==2 {print $4}')"

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Build both halves of the universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: App bundle and dmg
        run: |
          v="${{ steps.version.outputs.value }}"
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/bitchord \
            target/x86_64-apple-darwin/release/bitchord \
            -output bitchord-universal
          sh macos/bundle.sh bitchord-universal "$v" bundle
          codesign --verify bundle/bitchord.app
          # Mounts with the app next to an Applications shortcut, so
          # installing is a drag and a drop.
          mkdir -p dmg-staging
          cp -R bundle/bitchord.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname BitChord -srcfolder dmg-staging -ov -format UDZO \
            "dist/BitChord-$v-macos-universal.dmg"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux · tarballs, deb
    # The oldest supported Ubuntu, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: Native dependencies (GTK, WebKitGTK, ALSA, tray, DBus, TLS)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libssl-dev \
            dpkg-dev \
            pkg-config

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build --release

      # The installer tarball: the binary, install.sh with the launcher and icon it
      # installs, README and LICENSE. The portable one: the binary, the marker that makes
      # it portable, README and LICENSE. The updater on Linux reads them too. And the
      # .deb, which installs over the last one and only tells about new versions.
      - name: Tarballs and .deb
        run: |
          v="${{ steps.version.outputs.value }}"
          dir="bitchord-$v-linux-x86_64"
          mkdir -p out/"$dir"
          cp target/release/bitchord linux/install.sh linux/bitchord.desktop README.md LICENSE "out/$dir/"
          cp assets/icon/icon.png "out/$dir/bitchord.png"
          chmod 755 "out/$dir/bitchord" "out/$dir/install.sh"
          tar -czf "out/BitChord-$v-linux-x86_64.tar.gz" -C out "$dir"
          dir="bitchord-portable-$v-linux-x86_64"
          mkdir -p out/"$dir"
          cp target/release/bitchord linux/portable.txt README.md LICENSE "out/$dir/"
          chmod 755 "out/$dir/bitchord"
          tar -czf "out/BitChord-portable-$v-linux-x86_64.tar.gz" -C out "$dir"
          sh linux/deb.sh target/release/bitchord "$v" out
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            out/BitChord-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz
            out/BitChord-portable-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz
            out/bitchord_*_amd64.deb
          if-no-files-found: error

  release:
    name: Publish
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist

      - run: ls -lh dist

      - name: Draft the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BitChord ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          body: |
            ### Install notes

            - **Windows** — run the `-setup.exe`, or unzip the `-portable.zip`.
            - **macOS** — one universal build for Apple Silicon and Intel: open the `.dmg` and drag BitChord into Applications. The app is unsigned (no Apple Developer ID), so the first launch needs one extra step: right-click BitChord → **Open**, or allow it under System Settings → Privacy & Security → **Open Anyway**.
            - **Linux** — install the `.deb` (Debian, Ubuntu, Mint and friends), or download the other tarball, extract it and run `./install.sh` (installs into your user directory, with a menu entry and a `bitchord` command; it offers to install any missing libraries). For a run-anywhere copy, use the `-portable-` tarball. The installed and portable copies update themselves; a `.deb` install tells you when a new version is out, to install over it.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
