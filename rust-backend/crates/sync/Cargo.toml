[package]
name = "bitchord-sync"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Party synchronization protocol for BitChord Tauri backend"
keywords = ["sync", "party", "multiplayer", "music"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
tokio.workspace = true
futures.workspace = true
uuid.workspace = true
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
bitchord-core = { path = "../core" }
reqwest = { version = "0.12", features = ["json"] }
url = "2.5"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
