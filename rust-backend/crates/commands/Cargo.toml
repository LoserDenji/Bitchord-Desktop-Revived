[package]
name = "bitchord-commands"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tauri command handlers for BitChord backend"
keywords = ["tauri", "commands", "api", "music"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tauri.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
bitchord-core = { path = "../core" }
bitchord-state = { path = "../state" }
bitchord-db = { path = "../db" }
bitchord-library = { path = "../library" }
bitchord-sync = { path = "../sync" }
