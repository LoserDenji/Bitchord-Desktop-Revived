[package]
name = "bitchord-library"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Music library scanning and indexing for BitChord"
keywords = ["library", "scanner", "music", "index"]

[dependencies]
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
chrono = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
walkdir = { workspace = true, optional = true }
lofty = { workspace = true, optional = true }
bitchord-core = { path = "../core" }
bitchord-db = { path = "../db" }

[features]
full = ["walkdir", "lofty"]
default = ["full"]